name: Build and release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Build Linux on the oldest supported Ubuntu so the AppImage runs on older glibc
          - name: linux-x86_64
            runner: ubuntu-22.04
            args: --bundles deb,rpm,appimage
            bundle: src-tauri/target/release/bundle
          - name: linux-aarch64
            runner: ubuntu-22.04-arm
            args: --bundles deb,rpm,appimage
            bundle: src-tauri/target/release/bundle
          # Universal binary runs natively on both Apple Silicon and Intel Macs
          - name: macos-universal
            runner: macos-latest
            args: --target universal-apple-darwin --bundles dmg
            bundle: src-tauri/target/universal-apple-darwin/release/bundle
          - name: windows-x86_64
            runner: windows-latest
            args: ""
            bundle: src-tauri/target/release/bundle
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libssl-dev \
            patchelf \
            file

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      # The installers are named after the app version, so match it to the tag (v0.1.2 -> 0.1.2)
      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const v = process.env.GITHUB_REF_NAME.replace(/^v/, "");
            for (const f of ["package.json", "src-tauri/tauri.conf.json"]) {
              const j = JSON.parse(fs.readFileSync(f, "utf8"));
              j.version = v;
              fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            }
            console.log("version", v);
          '

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: symmich-${{ matrix.name }}
          path: |
            ${{ matrix.bundle }}/deb/*.deb
            ${{ matrix.bundle }}/rpm/*.rpm
            ${{ matrix.bundle }}/appimage/*.AppImage
            ${{ matrix.bundle }}/dmg/*.dmg
            ${{ matrix.bundle }}/nsis/*.exe
            ${{ matrix.bundle }}/msi/*.msi
          if-no-files-found: error

  # One release per tag, published only after every platform has built
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      # Each platform's packages keep their bundle folders (deb/, rpm/, dmg/, nsis/...)
      - name: List packages
        run: find dist -type f -exec ls -la {} +

      - name: Publish GitHub release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          name: Symmich ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/**/*.deb
            dist/**/*.rpm
            dist/**/*.AppImage
            dist/**/*.dmg
            dist/**/*.exe
            dist/**/*.msi
